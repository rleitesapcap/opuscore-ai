[project]
name = "opuscore-core"
version = "1.0.0"
description = "OPUSCORE-AI — contratos, SDK e regras compartilhadas (base de todos os pacotes)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "httpx>=0.27", "PyYAML>=6.0", "python-dotenv>=1.0", "mcp>=1.2,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opuscore_core*"]
