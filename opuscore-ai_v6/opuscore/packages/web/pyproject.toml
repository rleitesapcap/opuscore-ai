[project]
name = "opuscore-web"
version = "1.0.0"
description = "OPUSCORE-AI — shell web, design system e SDK das telas (JavaScript puro, sem build)"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opuscore_web*"]

[tool.setuptools.package-data]
opuscore_web = ["static/*", "static/*/*"]
