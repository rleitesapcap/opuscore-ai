[project]
name = "opuscore-ef"
version = "1.0.0"
description = "OPUSCORE-AI — EF: leitura, validação seção por seção e geração de rascunho (biblioteca)"
requires-python = ">=3.11"
dependencies = ["opuscore-core>=1.0", "python-docx>=1.1", "pypdf>=4.0", "pydantic>=2.9"]

[project.optional-dependencies]
imagens = ["Pillow>=10.0", "pymupdf>=1.24"]
pdf = ["pdfplumber>=0.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opuscore_ef*"]
