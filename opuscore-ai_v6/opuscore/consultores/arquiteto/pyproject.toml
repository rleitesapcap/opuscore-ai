[project]
name = "opuscore-consultor-arquiteto"
version = "1.0.0"
description = "OPUSCORE-AI — Arquiteto de Soluções (por enquanto: conversa; capacidades próprias a evoluir)"
requires-python = ">=3.11"
dependencies = ["opuscore-core>=1.0"]

[project.entry-points."opuscore.consultores"]
arquiteto = "opuscore_arquiteto.plugin:PLUGIN"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opuscore_arquiteto*"]
