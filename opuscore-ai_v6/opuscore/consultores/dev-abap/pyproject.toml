[project]
name = "opuscore-consultor-dev-abap"
version = "1.0.0"
description = "OPUSCORE-AI — Consultor Desenvolvedor ABAP: análise de objeto, Gerar ET, Remediar"
requires-python = ">=3.11"
dependencies = ["opuscore-core>=1.0", "opuscore-ef>=1.0", "fastapi>=0.115", "httpx>=0.27"]

[project.optional-dependencies]
# Bibliotecas dos motores de ET e remediação (pesadas). Instale só se for rodar os motores.
motores = ["langchain-core", "langchain-openai", "langchain-anthropic", "tenacity", "rank-bm25", "pymupdf",
           "sentence-transformers", "python-docx", "python-dotenv", "pdfplumber", "pypdf", "Pillow", "requests"]

[project.entry-points."opuscore.consultores"]
dev-abap = "opuscore_dev.plugin:PLUGIN"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opuscore_dev*"]

[tool.setuptools.package-data]
opuscore_dev = ["web/*", "motores/*/*.py", "motores/*/*.md", "motores/*/*.txt", "motores/*/.env.example", "motores/*/rag/*"]
