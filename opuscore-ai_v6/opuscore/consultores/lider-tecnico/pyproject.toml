[project]
name = "opuscore-consultor-lider-tecnico"
version = "1.0.0"
description = "OPUSCORE-AI — Líder Técnico (por enquanto: conversa; capacidades próprias a evoluir)"
requires-python = ">=3.11"
dependencies = ["opuscore-core>=1.0"]

[project.entry-points."opuscore.consultores"]
lider-tecnico = "opuscore_lider.plugin:PLUGIN"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opuscore_lider*"]
