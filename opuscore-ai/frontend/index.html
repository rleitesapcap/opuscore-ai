<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPUSCORE-AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<script src="./vendor/d3.min.js"></script>
</head>
<body>
  <aside class="rail">
    <div class="brand">
      <div class="spark"></div>
      <div><h1>OPUSCORE-AI</h1><small>SQUAD SAP</small></div>
    </div>
    <div>
      <h2>Squad</h2>
      <div class="squad" id="squad"></div>
    </div>
    <div class="conn" id="conn">
      <span class="live"></span><span id="connText">verificando conexão…</span>
      <div><span class="pill" id="modePill">—</span></div>
    </div>
  </aside>

  <main class="stage">
    <div class="topbar">
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5a678a" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" placeholder="analisar objeto no SAP  (ex.: MARA)" autocomplete="off">
      </label>
      <button class="btn" id="run">Analisar</button>
      <div class="seg" id="seg">
        <button data-mode="map" aria-selected="true">Mapa</button>
        <button data-mode="analysis" aria-selected="false">Análise</button>
      </div>
      <div class="ctx">
        <div class="obj" id="ctxObj">Desenvolvedor ABAP</div>
        <div class="sub" id="ctxSub">capacidades do especialista</div>
      </div>
    </div>

    <svg id="graph"></svg>

    <div class="legend" id="legend"></div>

    <div class="loading" id="loading">
      <div class="spin"></div>
      <div id="loadingTxt">consultando o SAP via ADT…</div>
    </div>

    <section class="inspect" id="inspect" aria-hidden="true">
      <button class="close" id="close" aria-label="Fechar">×</button>
      <div class="kind" id="iKind">objeto</div>
      <h3 id="iName">—</h3>
      <div class="meta" id="iMeta"></div>
      <div id="iBody"></div>
    </section>
  </main>

<script src="./app.js"></script>
</body>
</html>
